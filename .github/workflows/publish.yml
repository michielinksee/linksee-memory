name: Publish

# Trusted publishing (OIDC) — no npm token, no OTP, no recovery code.
#
# Why this exists: 0.12.0 took an hour to publish by hand. The account's only 2FA factor is a
# passkey, npm offers no authenticator-app option for it, and `npm publish` demands an OTP
# regardless of the auth-only setting — so the only route left was burning a paper recovery
# code. OIDC removes the whole class of problem: GitHub proves the workflow's identity to npm
# directly, and npm mints provenance from it.
#
# Also publishes server.json to the official MCP registry after npm succeeds (see the
# "Official MCP registry" steps below). If that part fails, npm is already done: the job goes red
# with a one-line "publish by hand" notice.
#
# Trigger: push a version tag.
#     npm version <patch|minor|major>   # bumps package.json (also update server.json + .well-known)
#     git push origin main --follow-tags
#
# The release gate still runs inside `npm publish` (prepublishOnly): clean tree, v<version> tag
# at HEAD, and package.json / server.json / .well-known agreeing. It protects CI exactly as it
# protects a laptop — that's the point of putting it in the package rather than in a runbook.
# (Verified: the first rehearsal was refused because HEAD was a branch tip, not the tag.)
#
# One-time setup on npmjs.com (Package settings → Trusted publisher):
#     Organization or user: michielinksee
#     Repository:           linksee-memory
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and run every check, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # the OIDC token npm verifies — without this the publish falls back to tokens

jobs:
  publish:
    name: Verify + publish to npm + MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release gate resolves refs/tags/v<version>; a shallow clone has none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI
        # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24 can be older.
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)  ·  node $(node --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        # Fail here with a readable message rather than deep inside prepublishOnly.
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match package.json $PKG"
              exit 1
            fi
            echo "tag v$TAG == package.json $PKG"
          else
            echo "manual run · package.json $PKG"
          fi

      - name: Release gate (explicit — `npm publish <tarball>` does not run prepublishOnly)
        # Same checks prepublishOnly used to run: clean tree, v<version> tag at HEAD, the three
        # manifests agree. Run once, here, before the one build. Skipped only for a dry-run
        # rehearsal, which sits on a branch tip and cannot pass the tag check by construction
        # (it fired correctly on the first rehearsal: tag v0.12.0 at 10e1081, HEAD at 06cce40).
        # A manual run with dry_run=false gets the full gate, like a tag push.
        env:
          LINKSEE_RELEASE_GATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'skip' || '' }}
        run: node scripts/release-gate.mjs

      - name: Build (the only build — the tarball below is made from it and published as is)
        run: pnpm run build

      - name: Tests (one list — test/suite.json, same as PR CI)
        # Before L-1-328 this step had its own hand-written list and had drifted from ci.yml:
        # the 0.18.1 no-delete tests never ran before a publish. Now both read test/suite.json.
        run: node scripts/run-tests.mjs

      - name: Pack once + preservation tests against that tarball
        # npm pack → install into an empty project → run test/required-tests.json `packed` there.
        # The tested .tgz is kept (with its integrity) and is the exact file published below.
        run: node scripts/test-packed.mjs --keep-tarball "$RUNNER_TEMP/linksee-memory.tgz"

      - name: MCP initialize + tools/list handshake
        run: |
          set -euo pipefail
          OUTPUT=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 15 node dist/mcp/server.js)
          for TOOL in recall remember drift_status; do
            if ! echo "$OUTPUT" | grep -q "\"name\":\"$TOOL\""; then
              echo "::error::tools/list missing '$TOOL'"
              exit 1
            fi
          done
          echo "✓ MCP handshake passed"

      - name: The file to publish is the tested tarball
        # Re-hash the kept file right before publishing; it must still be what the tests passed on.
        run: |
          set -euo pipefail
          TGZ="$RUNNER_TEMP/linksee-memory.tgz"
          TESTED=$(cat "$TGZ.integrity")
          NOW="sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)"
          echo "tested:  $TESTED"
          echo "publish: $NOW"
          if [ -z "$TESTED" ] || [ "$NOW" != "$TESTED" ]; then
            echo "::error::the tarball about to be published is not the one that passed the preservation tests"
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        # `--dry-run` DOES reach the registry (it authenticates, then refuses to overwrite an
        # existing version). So when the current version is already published, "cannot publish
        # over" is the success signal for a rehearsal: the tarball was accepted AND OIDC authenticated.
        # An auth failure looks different — ENEEDAUTH / EOTP / E401 — and still fails the step.
        run: |
          set -o pipefail
          echo "npm $(npm -v) · node $(node -v)"
          if npm publish "$RUNNER_TEMP/linksee-memory.tgz" --provenance --dry-run 2>&1 | tee /tmp/publish.log; then
            echo "✓ dry run clean — this version is not on the registry yet"
            exit 0
          fi
          if grep -q "cannot publish over the previously published versions" /tmp/publish.log; then
            echo "✓ rehearsal passed: authenticated via OIDC and the tested tarball was accepted."
            echo "  Refused only because $(node -p "require('./package.json').version") is already published — expected for a rehearsal."
            exit 0
          fi
          echo "::error::dry run failed for a reason other than an existing version"
          exit 1

      - name: Publish to npm (the tested tarball)
        id: npm_publish
        if: github.event_name == 'push' || !inputs.dry_run
        # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for short-lived credentials.
        # A tarball argument means npm neither runs prepublishOnly nor re-packs: the bytes published
        # are the bytes tested. The release gate ran explicitly above.
        run: |
          echo "npm $(npm -v) · node $(node -v)"
          npm publish "$RUNNER_TEMP/linksee-memory.tgz" --provenance

      # ── Official MCP registry (registry.modelcontextprotocol.io) ──────────────────────────────
      # Runs only after the npm publish above succeeded (a failed npm step skips everything below
      # except the notices). Follows the registry's own GitHub Actions guide:
      #   https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
      # mcp-publisher is pinned to one release and its Sigstore bundle is verified before use —
      # never `releases/latest`. To upgrade, change MCP_PUBLISHER_VERSION on purpose.
      # A dry run stops after `validate`: no login, no publish.

      - name: Install cosign (verifies the mcp-publisher download)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher (pinned)
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob             --bundle "$archive.sigstore.json"             --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"             --certificate-oidc-issuer "https://token.actions.githubusercontent.com"             "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          echo "mcp-publisher ${MCP_PUBLISHER_VERSION} (Sigstore-verified) at $RUNNER_TEMP/mcp-publisher"

      - name: server.json matches the tarball that went to npm
        # Second check, separate from the release gate: compare server.json with the package.json
        # INSIDE the published tarball (name ↔ mcpName, both versions), and with the tag on a push.
        # Any mismatch → nothing is sent to the registry.
        run: |
          set -euo pipefail
          tar -xzOf "$RUNNER_TEMP/linksee-memory.tgz" package/package.json > "$RUNNER_TEMP/packed-package.json"
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME#v}"; fi
          TAG="$TAG" PACKED="$RUNNER_TEMP/packed-package.json" node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(process.env.PACKED, "utf8"));
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const npmPkg = (srv.packages || []).find((p) => p.registryType === "npm" && p.identifier === pkg.name);
            const bad = [];
            if (srv.name !== pkg.mcpName) bad.push(`server.json name ${srv.name} != packed mcpName ${pkg.mcpName}`);
            if (srv.version !== pkg.version) bad.push(`server.json version ${srv.version} != packed version ${pkg.version}`);
            if (!npmPkg) bad.push(`server.json has no npm package entry for ${pkg.name}`);
            else if (npmPkg.version !== pkg.version) bad.push(`server.json packages[npm].version ${npmPkg.version} != packed version ${pkg.version}`);
            if (process.env.TAG && process.env.TAG !== pkg.version) bad.push(`tag v${process.env.TAG} != packed version ${pkg.version}`);
            if (bad.length) { for (const b of bad) console.log(`::error::${b}`); process.exit(1); }
            console.log(`server.json ${srv.name}@${srv.version} == npm tarball ${pkg.name}@${pkg.version}`);
          '

      - name: mcp-publisher validate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" --version || true
          "$RUNNER_TEMP/mcp-publisher" validate server.json

      - name: Publish to the MCP registry
        id: registry_publish
        if: github.event_name == 'push' || !inputs.dry_run
        # login github-oidc uses the same id-token: write permission as npm above; no secret.
        # The registry checks the npm package (mcpName) exists, so wait briefly for npm to serve it.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./server.json').version")
          for i in $(seq 1 12); do
            if [ "$(npm view "linksee-memory@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then break; fi
            echo "waiting for npm to serve linksee-memory@$VERSION ($i/12)"; sleep 10
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          # The registry checks npm from its own side, which can lag behind what this runner sees
          # (v0.20.0: npm view saw the version, the registry still got 404 "version ... was not found").
          # Retry only that error, up to 6 times, 60 s apart; any other error fails at once.
          for attempt in $(seq 1 6); do
            if out=$("$RUNNER_TEMP/mcp-publisher" publish server.json 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if ! printf '%s' "$out" | grep -q "was not found"; then exit 1; fi
            echo "registry cannot see linksee-memory@$VERSION on npm yet (attempt $attempt/6); retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Registry not updated — publish by hand
        if: failure() && steps.npm_publish.outcome == 'success'
        run: |
          echo "::error::npm has this version but the MCP registry was not updated. Run by hand from the tagged commit: mcp-publisher login github && mcp-publisher publish"

      - name: Summary
        if: always()
        run: |
          {
            echo "### linksee-memory"
            echo ""
            echo "- version: \`$(node -p "require('./package.json').version")\`"
            echo "- npm: \`$(npm --version)\` · node: \`$(node --version)\`"
            echo "- auth: trusted publishing (OIDC) — no token, no OTP"
            echo "- npm publish: \`${{ steps.npm_publish.outcome || 'not run' }}\` · MCP registry publish: \`${{ steps.registry_publish.outcome || 'not run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
