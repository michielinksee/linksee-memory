name: CI

# Build, security audit, and MCP handshake check for linksee-memory.
# Status visible at https://github.com/michielinksee/linksee-memory/actions
# Glama uses CI status as a maintenance signal.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + handshake + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (moderate+)
        run: pnpm audit --audit-level moderate

      - name: Build
        run: pnpm run build

      - name: MCP initialize + tools/list handshake
        run: |
          set -euo pipefail
          OUTPUT=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 15 node dist/mcp/server.js)

          echo "--- Server output ---"
          echo "$OUTPUT"
          echo "---------------------"

          # Verify initialize response
          if ! echo "$OUTPUT" | grep -q '"protocolVersion":"2024-11-05"'; then
            echo "::error::initialize response missing or wrong protocol version"
            exit 1
          fi

          # Verify tools/list response (8 tools expected)
          if ! echo "$OUTPUT" | grep -q '"name":"recall"'; then
            echo "::error::tools/list missing 'recall' tool"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q '"name":"remember"'; then
            echo "::error::tools/list missing 'remember' tool"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q '"name":"share_draft"'; then
            echo "::error::tools/list missing 'share_draft' tool"
            exit 1
          fi

          echo "✓ MCP handshake passed"

      - name: The test floor is not lowered vs the base branch (PRs only)
        # Reads test/required-tests.json from the PR base, not from the PR, so a PR cannot drop a
        # required name and the matching entry together. (It could still edit this step or the
        # script; that is what CODEOWNERS is for, once main requires code-owner review.)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/run-tests.mjs --check --base FETCH_HEAD

      - name: Tests (one list — test/suite.json, throwaway HOME and DB per test)
        # The same list `pnpm test` and publish.yml run. Never enumerate test files here:
        # scripts/run-tests.mjs --check fails if a workflow does (L-1-328).
        run: node scripts/run-tests.mjs

      - name: Preservation tests against the npm tarball
        # npm pack → npm install into an empty project → run the `packed` names from
        # test/required-tests.json there. Catches a package that passes in the tree but not as shipped.
        run: node scripts/test-packed.mjs --keep-tarball "$RUNNER_TEMP/linksee-memory.tgz"

      - name: "Observe only: npm 12, plain npx, no allowScripts (allowed to fail)"
        timeout-minutes: 4
        # npm 12 blocks dependency install scripts by default; a project-less npx has no package.json
        # allowScripts to unblock better-sqlite3. This shows what a user on npm 12 gets today.
        # Not a gate — continue-on-error — until the install instructions are fixed separately.
        continue-on-error: true
        run: |
          set +e -uo pipefail  # GitHub runs bash -e; keep going so the npx result is printed
          P="$RUNNER_TEMP/npm12"
          npm install --prefix "$P" --no-audit --no-fund --loglevel=error npm@12 >/dev/null
          NPX12="$P/node_modules/.bin/npx"
          echo "npm $("$P/node_modules/.bin/npm" -v) · node $(node -v)"
          H="$RUNNER_TEMP/npx-home"; mkdir -p "$H"
          export HOME="$H" USERPROFILE="$H" npm_config_cache="$H/.npm-cache" LINKSEE_MEMORY_DIR="$H/.linksee-memory" LINKSEE_TELEMETRY=off
          cd "$H"
          OUT=$(timeout 300 "$NPX12" --yes --package="$RUNNER_TEMP/linksee-memory.tgz" -- linksee-memory-stats 2>&1); RC=$?
          echo "$OUT" | tail -30
          if [ "$RC" -eq 0 ]; then VERDICT="works"; else VERDICT="fails (exit $RC)"; fi
          echo "npm 12 + plain npx linksee-memory-stats: $VERDICT"
          { echo "### npm 12 · plain npx (observe only)"; echo ""; echo "- linksee-memory-stats: $VERDICT"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then echo "::warning::npm 12 + plain npx: linksee-memory-stats $VERDICT (install scripts blocked?)"; exit 1; fi
